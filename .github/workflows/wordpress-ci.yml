name: WordPress + WooCommerce Integration (Sandbox)
on:
  push:
    branches: ["feat/wordpress-woocommerce-ci-sandbox"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  wordpress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_PASSWORD: ci_only_droperagent_password
      DB_ROOT_PASSWORD: ci_only_root_password
      WP_ADMIN_PASSWORD: ci_only_admin_password
    steps:
      - uses: actions/checkout@v4
      - name: Check compose syntax
        run: docker compose config --quiet
      - name: Start real WordPress and MariaDB
        run: docker compose up -d db wordpress
      - name: Wait for WordPress HTTP
        run: |
          ready=0
          for i in $(seq 1 40); do
            if curl --silent --output /dev/null --max-time 4 http://127.0.0.1:8080/; then ready=1; break; fi
            sleep 3
          done
          test "$ready" -eq 1
      - name: Install WordPress with WP-CLI
        run: |
          installed=0
          for i in $(seq 1 25); do
            if docker compose run --rm --user 0 --entrypoint wp wpcli core install --url=http://127.0.0.1:8080 --title='DroperAgent CI Sandbox' --admin_user=ci_admin --admin_password="$WP_ADMIN_PASSWORD" --admin_email=ci@example.invalid --skip-email --allow-root; then
              installed=1
              break
            fi
            sleep 4
          done
          test "$installed" -eq 1
      - name: Fix shared volume ownership for WordPress PHP and WP-CLI
        run: docker compose exec -T -u root wordpress chown -R www-data:www-data /var/www/html/wp-content
      - name: Install and activate WooCommerce
        run: |
          docker compose run --rm --user 0 --entrypoint wp wpcli plugin install woocommerce --activate --allow-root
          docker compose run --rm --user 0 --entrypoint wp wpcli plugin is-active woocommerce --allow-root
          docker compose exec -T -u root wordpress chown -R www-data:www-data /var/www/html/wp-content
      - name: Validate DROPERAGENT API Connections admin plugin, encryption and role access
        run: |
          docker compose exec -T -u root wordpress mkdir -p /var/www/html/wp-content/plugins/droperagent-api-connections
          docker compose cp wordpress/droperagent-api-connections/droperagent-api-connections.php wordpress:/var/www/html/wp-content/plugins/droperagent-api-connections/droperagent-api-connections.php
          docker compose exec -T wordpress php -l /var/www/html/wp-content/plugins/droperagent-api-connections/droperagent-api-connections.php
          docker compose run --rm --user 0 --entrypoint wp wpcli plugin activate droperagent-api-connections --allow-root
          docker compose run --rm --user 0 --entrypoint wp wpcli eval '
          if (!class_exists("DroperAgent_API_Connections")) throw new Exception("Missing API Connections class");
          $cls="DroperAgent_API_Connections";
          $plain="cj_test_demo_only_nothing_real_01234567";
          $sealed=$cls::seal($plain);
          if (!is_string($sealed) || $sealed===$plain || substr($sealed,0,3)!=="v1:") throw new Exception("Encryption failed");
          $cls::store("key", $plain);
          if ($cls::open("key")!==$plain) throw new Exception("Encryption roundtrip failed");
          $ae_key="1234567890";
          $ae_secret="ae_test_secret_never_real_01234567890";
          if (!$cls::ae_store("app_key",$ae_key) || !$cls::ae_store("app_secret",$ae_secret))
            throw new Exception("AliExpress encryption failed");
          if ($cls::ae_open("app_key")!==$ae_key || $cls::ae_open("app_secret")!==$ae_secret)
            throw new Exception("AliExpress decrypt mismatch");
          if ($cls::ae_open("invalid_field")!==false)
            throw new Exception("Unexpected AliExpress field accepted");
          if ($cls::open("key")!==$plain) throw new Exception("CJ key changed during AliExpress save");
          if (in_array("droper_api_ae_app_secret",array_keys(wp_load_alloptions()),true))
            throw new Exception("AliExpress secret autoloaded");
          $callback=$cls::ae_callback_url();
          if (strpos($callback,"https://")!==0 || strpos($callback,"action=droper_api_ae_callback")===false)
            throw new Exception("AliExpress OAuth callback invalid");
          $cls::ae_revoke_tokens();
          if ($cls::ae_open("app_secret")!==$ae_secret)
            throw new Exception("AliExpress token revocation deleted app credentials");
          foreach(array("app_key","app_secret") as $field)delete_option("droper_api_ae_".$field);
          if ($cls::ae_open("app_key")!==false)throw new Exception("AliExpress credential deletion failed");
          if ($cls::open("key")!==$plain)throw new Exception("CJ lost after AliExpress revoke");
          $bg_id="Banggood_1234567";
          $bg_secret="fake_BG_secret_0123456789_abcdefghijkl";
          if (!$cls::bg_store("app_id",$bg_id) || !$cls::bg_store("app_secret",$bg_secret))
            throw new Exception("Banggood sealed storage failed");
          if ($cls::bg_open("app_id")!==$bg_id || $cls::bg_open("app_secret")!==$bg_secret)
            throw new Exception("Banggood encrypted roundtrip failed");
          if ($cls::bg_open("invalid_field")!==false || $cls::bg_store("invalid_field","unsafe")!==false)
            throw new Exception("Banggood arbitrary option access");
          if (in_array("droper_api_bg_app_secret",array_keys(wp_load_alloptions()),true))
            throw new Exception("Banggood secret auto-loaded");
          if ($cls::open("key")!==$plain)throw new Exception("Banggood affected CJ");
          $cls::bg_clear();
          if ($cls::bg_open("app_id")!==false || $cls::bg_open("app_secret")!==false)
            throw new Exception("Banggood revoke failed");
          if ($cls::open("key")!==$plain)throw new Exception("Banggood revoke affected CJ");
          $cls::bg_store("app_id",$bg_id);
          $cls::bg_store("app_secret",$bg_secret);
          if ($cls::ae_open("app_key")!==false)throw new Exception("Banggood changed AliExpress after revoke");
          $cls::bg_clear();


          if (in_array("droper_api_cj_key", array_keys(wp_load_alloptions()),true)) throw new Exception("Secret was autoloaded");
          if (!$cls::key()) throw new Exception("Sodium unavailable");
          $cls::clear();
          if ($cls::open("key")!==false) throw new Exception("Credential deletion failed");
          wp_set_current_user(0);
          if (current_user_can("manage_options")) throw new Exception("Anon permission bypass");
          $user=get_user_by("login","ci_admin");
          wp_set_current_user($user->ID);
          if (!current_user_can("manage_options")) throw new Exception("Admin permission missing");
          echo "DROPERAGENT Connections CJ+AliExpress+Banggood encryption, isolation, callback and roles PASS\n";
          ' --allow-root
      - name: Verify real WooCommerce variant and shipping readiness is read-only
        run: |
          docker compose run --rm --user 0 --entrypoint wp wpcli eval '
          $cls="DroperAgent_API_Connections";
          $p = new WC_Product_Variable();
          $p->set_name("CI Variable Product");
          $p->set_status("publish");
          $p->set_sku("ci-audit-parent");
          $att = new WC_Product_Attribute();
          $att->set_name("Color");
          $att->set_options(array("OnlyAccess","Blue"));
          $att->set_visible(true);
          $att->set_variation(true);
          $p->set_attributes(array($att));
          $id = $p->save();
          if (!$id) throw new Exception("Variable parent creation failed");
          $v = new WC_Product_Variation();
          $v->set_parent_id($id);
          $v->set_status("publish");
          $v->set_sku("ci-onlyaccess-test");
          $v->set_attributes(array("Color"=>"OnlyAccess"));
          $v->set_regular_price("6.44");
          $v->set_manage_stock(true);
          $v->set_stock_quantity(1);
          $vid = $v->save();
          if (!$vid) throw new Exception("Variation creation failed");
          $before = (int) wc_get_product($vid)->get_stock_quantity();
          $audit = $cls::commerce_readiness_snapshot();
          if (!is_array($audit) || $audit["read_only"] !== true || $audit["checkout_ready"] !== false) {
            throw new Exception("Readiness audit authorization is unsafe");
          }
          if ($audit["variant_count"] < 1 || $audit["product_count"] < 1) {
            throw new Exception("Snapshot did not see variable product");
          }
          $matches = array_values(array_filter($audit["rows"],
            function($row) use ($vid) { return $row["variation_id"] === $vid; }));
          if (count($matches)!==1) throw new Exception("Variation not found in audit");
          if ($matches[0]["price"] !== "6.44" || $matches[0]["sku"] !== "ci-onlyaccess-test")
            throw new Exception("SKU / store price mismatch");
          if (!$matches[0]["low_stock"] || !$matches[0]["accessory_review"] || !$matches[0]["missing_dimensions"])
            throw new Exception("Risk review missed low stock, accessory, missing dimensions");
          if ($before !== (int) wc_get_product($vid)->get_stock_quantity())
            throw new Exception("Readiness scan mutated stock");
          if (!empty($audit["shipping"]["cost_verified"]) || !empty($audit["shipping"]["crossborder_freight_verified"]))
            throw new Exception("Shipping was claimed verified without quote");
          $anon=0; wp_set_current_user($anon);
          if (current_user_can("manage_options")) throw new Exception("Anon unexpectedly has audit admin permission");
          echo "DROPERAGENT catalog + Brazil shipping readiness read-only audit PASS\n";
          ' --allow-root
      - name: Verify manual BRL quote and margin ledger is fail-closed
        run: |
          docker compose run --rm --user 0 --entrypoint wp wpcli eval '
          $cls = "DroperAgent_API_Connections";
          if ($cls::cost_amount_cents("6,44") !== 644 || $cls::cost_amount_cents("0") !== 0 ||
              $cls::cost_amount_cents("999.99") !== 99999 ||
              $cls::cost_amount_cents("0,1") !== 10) throw new Exception("BRL cents parser incorrect");
          foreach (array("-1.00", "1.234,56", "1e3", "0.001", "", "NaN", "10x", "1 2") as $bad)
            if ($cls::cost_amount_cents($bad) !== false)
              throw new Exception("Unsafe amount accepted: " . $bad);
          $vid = 4321; $sku = "ci-quote-sku";
          $name = $cls::cost_option_name($vid);
          if ($cls::cost_option_name(0) !== false) throw new Exception("Invalid quote ID");
          $record = array("schema" => 1, "sku_hash" => hash("sha256", $sku),
            "price_at_capture" => 644, "timestamp" => time() - DAY_IN_SECONDS,
            "supplier" => 500, "shipping" => 300, "import_tax" => 100,
            "payment_fee" => 50, "other" => 40, "origin_country" => "CN",
            "destination_cep" => "88054000",
            "source_url" => "https://supplier.example/quote",
            "evidence_status" => "operator_entry_not_independently_verified");
          update_option($name, $record, false);
          if (in_array($name, array_keys(wp_load_alloptions()), true))
            throw new Exception("Quote was autoloaded");
          $stored = $cls::cost_quote_read($vid, $sku);
          if (!$stored || $cls::cost_quote_read($vid, "different-sku") !== false)
            throw new Exception("Quote/SKU identity check failed");
          $calc = $cls::cost_evidence_report($stored, "6.44");
          if ($calc["cost_total_cents"] !== 990 || $calc["gross_margin_cents"] !== -346 ||
              $calc["sell_authorized"] !== false || $calc["supplier_verified"] !== false ||
              $calc["shipping_verified"] !== false || $calc["taxes_verified"] !== false ||
              $calc["stale"] !== false || $calc["price_changed"] !== false)
            throw new Exception("Quote margin or verification gate failed");
          $changed = $cls::cost_evidence_report($stored, "7.00");
          if (!$changed["price_changed"]) throw new Exception("Price change not detected");
          $record["timestamp"] = time() - 16 * DAY_IN_SECONDS;
          $stale = $cls::cost_evidence_report($record, "6.44");
          if (!$stale["stale"]) throw new Exception("Expired supplier quote considered fresh");
          $record["supplier"] = -5;
          if ($cls::cost_evidence_report($record, "6.44") !== false)
            throw new Exception("Negative supplier cost accepted");
          delete_option($name);
          if ($cls::cost_quote_read($vid, $sku) !== false)
            throw new Exception("Quote record was not deleted");
          echo "DROPERAGENT per-SKU manual cost evidence, negative margin, identity, expiry and redaction PASS\n";
          ' --allow-root
      - name: Create and reread a real WooCommerce product via database
        run: |
          docker compose run --rm --user 0 --entrypoint wp wpcli eval '
          $p = new WC_Product_Simple();
          $p->set_name("CI Draft Product");
          $p->set_status("draft");
          $p->set_regular_price("19.90");
          $id = $p->save();
          if (!$id) { throw new Exception("Product creation failed"); }
          update_option("droperagent_ci_product_id", $id);
          echo "Created product id: " . $id . "\n";
          ' --allow-root
          docker compose run --rm --user 0 --entrypoint wp wpcli eval '
          $id = (int) get_option("droperagent_ci_product_id");
          $p = wc_get_product($id);
          if (!$p || $p->get_name() !== "CI Draft Product" || $p->get_status() !== "draft") {
            throw new Exception("Product did not persist");
          }
          echo "Persisted product id: " . $id . "\n";
          ' --allow-root
      - name: Verify real WooCommerce REST controller
        run: |
          docker compose run --rm --user 0 --entrypoint wp wpcli eval '
          $user = get_user_by("login", "ci_admin");
          if (!$user) { throw new Exception("CI admin missing"); }
          wp_set_current_user($user->ID);
          $id = (int) get_option("droperagent_ci_product_id");
          $response = rest_do_request(new WP_REST_Request("GET", "/wc/v3/products/" . $id));
          if ($response->get_status() !== 200) {
            throw new Exception("WooCommerce REST status " . $response->get_status());
          }
          $product = $response->get_data();
          if ((int)$product["id"] !== $id || $product["name"] !== "CI Draft Product") {
            throw new Exception("WooCommerce REST data mismatch");
          }
          echo "WooCommerce REST controller PASS for product " . $id . "\n";
          ' --allow-root
      - name: Verify WooCommerce REST API authenticated over HTTPS (real network)
        run: |
          mkdir -p .ci/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout .ci/certs/server.key -out .ci/certs/server.crt \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          docker compose run --rm --user 0 --entrypoint wp wpcli rewrite structure '/%postname%/' --hard --allow-root
          docker compose run --rm --user 0 --entrypoint wp wpcli option update home 'https://localhost:8443' --allow-root
          docker compose run --rm --user 0 --entrypoint wp wpcli option update siteurl 'https://localhost:8443' --allow-root
          docker compose exec -T -u root wordpress chown -R www-data:www-data /var/www/html/wp-content
          docker compose run --rm --user 0 --entrypoint wp wpcli eval '
          $user = get_user_by("login","ci_admin");
          if (!$user) { throw new Exception("CI user not found"); }
          $key = "ck_" . bin2hex(random_bytes(20));
          $secret = "cs_" . bin2hex(random_bytes(20));
          global $wpdb;
          $ok = $wpdb->insert($wpdb->prefix . "woocommerce_api_keys", [
            "user_id" => $user->ID,
            "description" => "Disposable HTTPS API E2E",
            "permissions" => "read_write",
            "consumer_key" => wc_api_hash($key),
            "consumer_secret" => $secret,
            "truncated_key" => substr($key,-7)
          ]);
          if (!$ok) { throw new Exception("Failed to create WooCommerce REST key"); }
          file_put_contents("/var/www/html/wp-content/ci-rest-keys", $key . "\n" . $secret . "\n");
          ' --allow-root
          docker compose exec -T -u root wordpress cat /var/www/html/wp-content/ci-rest-keys > .ci/woo-keys
          chmod 600 .ci/woo-keys
          docker compose --profile ci up -d https-proxy
          ready=0
          for attempt in $(seq 1 20); do
            if curl --silent --insecure --fail https://localhost:8443/wp-json/ -o /dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          mapfile -t creds < .ci/woo-keys
          WOO_CI_KEY="${creds[0]}" WOO_CI_SECRET="${creds[1]}" \
            NODE_EXTRA_CA_CERTS="$PWD/.ci/certs/server.crt" \
            node tests/woocommerce-https-e2e.cjs
          rm -f .ci/woo-keys
      - name: Collect diagnostics on failure
        if: failure()
        run: docker compose logs --tail=100 --no-color
      - name: Tear down isolated sandbox
        if: always()
        run: docker compose down -v
