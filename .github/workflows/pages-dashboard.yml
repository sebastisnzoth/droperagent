name: DroperAgent · GitHub Pages Dashboard
on:
  push:
    branches: [main, feat/github-pages-dashboard]
    paths:
      - 'web/**'
      - '.github/workflows/pages-dashboard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Verify output and reject exposed credentials
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q '/droperagent/assets/' dist/index.html
          ! grep -RniE 'WC_CONSUMER_SECRET|ASAAS_SANDBOX_API_KEY|service_role|sk_live_' dist/assets
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - id: deployment
        name: Deploy Pages
        uses: actions/deploy-pages@v4
