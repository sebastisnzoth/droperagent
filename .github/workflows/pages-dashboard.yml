name: DroperAgent · GitHub Pages Dashboard
on:
  push:
    branches: [main, feat/github-pages-dashboard]
    paths:
      - 'web/**'
      - '.github/workflows/pages-dashboard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend tests
        run: npm test
      - name: Typecheck and build
        env:
          VITE_DROPERAGENT_API_URL: ${{ vars.DROPERAGENT_API_URL || 'https://droperagent-api.onrender.com' }}
          VITE_ENABLE_LIVE_READONLY: ${{ vars.DROPERAGENT_LIVE_READONLY || 'true' }}
        run: npm run build
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Test desktop, mobile and LIVE login UI in browser
        env:
          VITE_DROPERAGENT_API_URL: https://api.droperagent.test
          VITE_ENABLE_LIVE_READONLY: 'true'
        run: npm run test:e2e
      - name: Upload browser captures and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droperagent-browser-captures
          path: |
            web/screenshots/
            web/test-results/
          if-no-files-found: ignore
      - name: Verify output and reject exposed credentials
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q '/droperagent/assets/' dist/index.html
          ! grep -RniE 'WC_CONSUMER_SECRET|ASAAS_SANDBOX_API_KEY|service_role|sk_live_' dist/assets
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - id: deployment
        name: Deploy Pages
        uses: actions/deploy-pages@v4
  verify-public:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify public HTML and compiled assets respond HTTP 200
        run: |
          URL='https://sebastisnzoth.github.io/droperagent/'
          ready=0
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error --max-time 10 "$URL" -o /tmp/droperagent-page.html; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          grep -q 'DroperAgent' /tmp/droperagent-page.html
          grep -q '/droperagent/assets/' /tmp/droperagent-page.html
          for asset in $(grep -oE '/droperagent/assets/[^" ]+\\.(js|css)' /tmp/droperagent-page.html | sort -u); do
            curl --fail --location --silent --show-error --max-time 15 "https://sebastisnzoth.github.io$asset" -o /dev/null
            echo "Verified: $asset"
          done
          echo "GitHub Pages HTTP and asset checks passed at $URL"
