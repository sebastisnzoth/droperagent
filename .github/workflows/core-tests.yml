name: DroperAgent Core Tests
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check src/task-engine.js
          node --check src/index.js
          node --check src/supplier-evidence-audit.js
          node --check src/product-hunter-readiness.js
          node --check src/br-market-benchmark.js
          node --check src/woo-variation-snapshot.js
          node --check src/cj-readonly-client.js
          node --check src/woocommerce-client.js
          node --check src/mcp-server.mjs
          node --check worker.js
      - name: Core and WooCommerce adapter unit tests (no external dependencies)
        run: node --test tests/*.test.js
      - name: Install MCP SDK dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Authenticated HTTP API security integration test
        run: node --test tests/http-auth.test.mjs
      - name: Ensure WooCommerce upstream errors never leak credentials
        run: node --test tests/woo-error-redaction.test.mjs
      - name: Authenticated DSers mapping preflight safety test
        run: node --test tests/mapping-preflight-http.test.mjs
      - name: Supplier evidence preflight HTTP auth and no-write safety test
        run: node --test tests/supplier-evidence-preflight-http.test.mjs
      - name: WooCommerce live variation snapshot authentication, limits and redaction
        run: node --test tests/woo-variation-snapshot-http.test.mjs
      - name: CJ supplier read-only API authentication and no-purchase HTTP test
        run: node --test tests/cj-readonly-http.test.mjs
      - name: Real MCP client-server protocol test
        run: node --test tests/mcp.test.mjs
