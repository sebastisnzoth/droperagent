name: DroperAgent Core Tests
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check src/task-engine.js
          node --check src/index.js
          node --check src/woocommerce-client.js
          node --check worker.js
      - name: Core and WooCommerce adapter unit tests (no external dependencies)
        run: node --test tests/*.test.js
